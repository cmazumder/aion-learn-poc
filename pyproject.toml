[project]
name = "aion-poc"
version = "0.1.0"
description = "AI-driven RCA and diagnostic assistant for electric vehicle charging stations"
authors = [
    {name = "Chayan Mazumder chayan.mazumder@chargepoint.com"}
]
packages = [{include = "aion_poc", from = "src"}]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi (>=0.120.4,<0.121.0)",
    "uvicorn[standard] (>=0.38.0,<0.39.0)",
    "sentence-transformers (>=5.1.2,<6.0.0)",
    "chromadb (==0.5.23)",
    "pydantic (>=2.12.3,<3.0.0)",
    "pydantic-settings (>=2.11.0,<3.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "unstructured[json,pdf] (>=0.18.15,<0.19.0)",
    "lark (>=1.3.1,<2.0.0)",
    "langchain (>=1.0.3,<2.0.0)",
    "langchain-community (>=0.4.1,<0.5.0)",
    "langchain-google-vertexai (>=3.0.1,<4.0.0)",
    "jq (>=1.10.0,<2.0.0)",
    "tabulate (>=0.9.0,<0.10.0)",
    "langchain-text-splitters (>=1.0.0,<2.0.0)",
    "langchain-ollama (>=1.0.0,<2.0.0)",
    "httpx (>=0.27.0,<0.29.0)",
    "streamlit (>=1.52.1,<2.0.0)",
    "markdown (>=3.6,<4.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=8.4.2,<9.0.0)",
    "ruff (>=0.14.3,<0.15.0)",
    "black (>=25.9.0,<26.0.0)",
    "mypy (>=1.18.2,<2.0.0)",
    "jupyterlab (>=4.4.10,<5.0.0)",
    "mdformat (>=1.0.0,<2.0.0)",
    "watchdog (>=6.0.0,<7.0.0)"
]
